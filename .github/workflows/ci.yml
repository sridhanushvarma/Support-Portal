# Quality gates for every pull request (NFR-17, NFR-18, NFR-24).
# GitHub only runs workflows from the repository root's .github directory; if this
# app lives in a sub-folder of a larger repository, move this file there and keep
# `working-directory` pointing at the app.
name: CI

on:
  pull_request:
  push:
    branches: [main, master]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: corporate-website

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: corpweb_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U app" --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://app:app@127.0.0.1:5432/corpweb_test?schema=public
      E2E_DATABASE_URL: postgresql://app:app@127.0.0.1:5432/corpweb_e2e?schema=public
      # Build-time placeholders only; no real secrets are used in CI.
      DATABASE_URL: postgresql://app:app@127.0.0.1:5432/corpweb_test?schema=public
      SITE_URL: http://127.0.0.1:3100
      APP_SECRET: ci-only-secret-ci-only-secret-0123456789
      APP_ENCRYPTION_KEY: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: corporate-website/package-lock.json
      - run: npm ci
      - name: Dependency audit
        run: npm audit --audit-level=high
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - name: Schema matches migrations
        run: npx prisma migrate diff --from-migrations prisma/migrations --to-schema-datamodel prisma/schema.prisma --shadow-database-url "$TEST_DATABASE_URL" --exit-code
      - run: npm test
      - run: npm run test:integration
      - name: Create e2e database
        run: PGPASSWORD=app psql -h 127.0.0.1 -U app -d corpweb_test -c "CREATE DATABASE corpweb_e2e"
      - run: npx playwright install --with-deps chromium
      - name: End-to-end tests (production build)
        run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: corporate-website/playwright-report
          retention-days: 7

  container:
    runs-on: ubuntu-24.04
    needs: verify
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build production image
        run: docker build --target runner -t corporate-website:${{ github.sha }} .
