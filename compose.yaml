# Production-like stack for a single host. Put a TLS-terminating reverse proxy
# (Caddy, nginx, a cloud load balancer) in front of `app` and keep TRUST_PROXY=true.
#
#   cp .env.example .env.production   # fill in real values
#   docker compose --env-file .env.production up -d --build
#   docker compose run --rm tools npm run admin:create -- --email you@company.com --name "Your Name"

x-app-env: &app-env
  APP_ENV: ${APP_ENV:-production}
  SITE_URL: ${SITE_URL:?set SITE_URL}
  SITE_INDEXABLE: ${SITE_INDEXABLE:-false}
  DATABASE_URL: postgresql://${POSTGRES_USER:-app}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB:-corpweb}?schema=public
  APP_SECRET: ${APP_SECRET:?set APP_SECRET}
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?set APP_ENCRYPTION_KEY}
  TRUST_PROXY: ${TRUST_PROXY:-true}
  ADMIN_MFA_REQUIRED: ${ADMIN_MFA_REQUIRED:-true}
  SESSION_IDLE_MINUTES: ${SESSION_IDLE_MINUTES:-30}
  SESSION_MAX_HOURS: ${SESSION_MAX_HOURS:-12}
  EMAIL_PROVIDER: ${EMAIL_PROVIDER:-smtp}
  EMAIL_FROM: ${EMAIL_FROM:-}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_SECURE: ${SMTP_SECURE:-false}
  OPS_ALERT_EMAIL: ${OPS_ALERT_EMAIL:-}
  CRON_SECRET: ${CRON_SECRET:-}
  MEDIA_STORAGE_DIR: /app/storage/media

services:
  db:
    image: postgres:18.6
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-corpweb}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-app} -d ${POSTGRES_DB:-corpweb}"]
      interval: 10s
      timeout: 5s
      retries: 10

  # One-shot: applies pending migrations before the app starts. Also used for admin CLI tasks.
  tools:
    build: { context: ., target: tools }
    environment: *app-env
    depends_on:
      db: { condition: service_healthy }
    restart: "no"

  app:
    build:
      context: .
      target: runner
      args:
        NEXT_PUBLIC_ANALYTICS_SCRIPT_URL: ${NEXT_PUBLIC_ANALYTICS_SCRIPT_URL:-}
        NEXT_PUBLIC_ANALYTICS_DOMAIN: ${NEXT_PUBLIC_ANALYTICS_DOMAIN:-}
    restart: unless-stopped
    environment: *app-env
    ports:
      - "127.0.0.1:${APP_PORT:-3000}:3000"
    volumes:
      - media:/app/storage/media
    depends_on:
      db: { condition: service_healthy }
      tools: { condition: service_completed_successfully }

  worker:
    build: { context: ., target: runner }
    restart: unless-stopped
    command: ["node", "dist/worker.mjs"]
    environment: *app-env
    volumes:
      - media:/app/storage/media
    healthcheck: { disable: true }
    depends_on:
      db: { condition: service_healthy }
      tools: { condition: service_completed_successfully }

volumes:
  pgdata:
  media:
